<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Broker Positions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0d0f17; color: #e1e1e6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { background-color: #161926; border: 1px solid #282c3f; border-radius: 8px; }
        .accent-gold { color: #d4af37; }
        .btn-gold { background-color: #d4af37; color: #000; font-weight: bold; border: none; }
    </style>
</head>
<body class="p-4">
    <div class="container" style="max-width: 1200px;">
        <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-secondary">
            <h2 class="m-0"><span class="accent-gold">Open Trade</span> Positions</h2>
            <div>
                <a href="/" class="btn btn-outline-light me-2">Dashboard</a>
                <a href="/positions" class="btn btn-gold me-2">Open Trades</a>
                <a href="/settings" class="btn btn-outline-warning">Settings</a>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <button onclick="loadPositions()" class="btn btn-outline-info">Refresh Positions</button>
            <button onclick="closeAllPositions()" class="btn btn-danger fw-bold">Emergency: Close All Trades</button>
        </div>

        <div class="card p-3">
            <div class="table-responsive">
                <table class="table table-dark table-hover align-middle">
                    <thead>
                        <tr>
                            <th>Position ID</th>
                            <th>Symbol</th>
                            <th>Type</th>
                            <th>Volume</th>
                            <th>Open Price</th>
                            <th>Current Price</th>
                            <th>Profit / Loss</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="positionsTableBody">
                        <tr><td colspan="8" class="text-center text-muted">Loading active positions from broker...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function loadPositions() {
            const tbody = document.getElementById('positionsTableBody');
            try {
                const response = await fetch('/api/positions');
                const data = await response.json();

                if (data.status === 'success') {
                    if (data.positions.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted">No open trades on MetaTrader account.</td></tr>';
                        return;
                    }

                    tbody.innerHTML = '';
                    data.positions.forEach(pos => {
                        const pnl = parseFloat(pos.profit || 0);
                        const pnlClass = pnl >= 0 ? 'text-success' : 'text-danger';
                        const typeClass = pos.type === 'POSITION_TYPE_BUY' ? 'text-success' : 'text-danger';
                        const typeLabel = pos.type === 'POSITION_TYPE_BUY' ? 'BUY' : 'SELL';

                        tbody.innerHTML += `
                            <tr>
                                <td>${pos.id}</td>
                                <td>${pos.symbol}</td>
                                <td class="${typeClass} fw-bold">${typeLabel}</td>
                                <td>${pos.volume}</td>
                                <td>$${pos.openPrice}</td>
                                <td>$${pos.currentPrice || '--'}</td>
                                <td class="${pnlClass} fw-bold">$${pnl.toFixed(2)}</td>
                                <td>
                                    <button onclick="closeTrade('${pos.id}')" class="btn btn-sm btn-outline-danger">Close Trade</button>
                                </td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="8" class="text-center text-danger">Error: ${data.message}</td></tr>`;
                }
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="8" class="text-center text-danger">Failed to connect: ${err}</td></tr>`;
            }
        }

        async function closeTrade(positionId) {
            if(!confirm(`Close position ${positionId}?`)) return;
            try {
                const response = await fetch('/api/trade/close', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ positionId: positionId })
                });
                const res = await response.json();
                if (res.status === 'success') {
                    alert('Position closed.');
                    loadPositions();
                } else {
                    alert('Failed to close position: ' + res.message);
                }
            } catch (err) {
                alert('Error: ' + err);
            }
        }

        async function closeAllPositions() {
            if(!confirm('EMERGENCY: Are you sure you want to close ALL active positions?')) return;
            try {
                const response = await fetch('/api/trade/close-all', { method: 'POST' });
                const res = await response.json();
                alert(`Closed ${res.closed_count} positions.`);
                loadPositions();
            } catch (err) {
                alert('Error closing all positions: ' + err);
            }
        }

        loadPositions();
        setInterval(loadPositions, 5000);
    </script>
</body>
</html>
